<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">AIXS — Frontier AI should fit on your machine</title>
  <desc id="desc">Dark technical banner with AIXS wordmark, research tagline and a five-layer local AI system diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090b"/><stop offset="1" stop-color="#0c1217"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2f5f7"/><stop offset="1" stop-color="#9eeeff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8fefff" stop-opacity=".18"/><stop offset="1" stop-color="#8fefff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#cdefff" stroke-opacity=".055"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <ellipse cx="1280" cy="230" rx="380" ry="310" fill="url(#glow)" filter="url(#blur)"/>
  <g transform="translate(78 72)">
    <text x="0" y="62" fill="#f2f5f7" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-4">AI</text>
    <text x="64" y="62" fill="none" stroke="#9eeeff" stroke-width="1.6" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-4">X</text>
    <text x="106" y="62" fill="#f2f5f7" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-4">S</text>
    <text x="0" y="112" fill="#8d98a3" font-family="monospace" font-size="15" letter-spacing="3">OPEN RESEARCH INITIATIVE · COMMUNITY-BUILT</text>
    <text x="0" y="228" fill="#f2f5f7" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">Frontier AI should fit</text>
    <text x="0" y="298" fill="#a9f1ff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">on your machine.</text>
    <text x="0" y="352" fill="#9aa6b0" font-family="Arial, Helvetica, sans-serif" font-size="22">Research. Optimize. Reproduce. Together.</text>
    <line x1="0" y1="414" x2="630" y2="414" stroke="#dff8ff" stroke-opacity=".13"/>
    <text x="0" y="453" fill="#71808b" font-family="monospace" font-size="13" letter-spacing="2">MODEL × HARNESS × SOFTWARE × OS × HARDWARE</text>
  </g>
  <g transform="translate(1050 74)">
    <circle cx="230" cy="210" r="205" fill="none" stroke="#9eeeff" stroke-opacity=".12"/>
    <circle cx="230" cy="210" r="164" fill="none" stroke="#9eeeff" stroke-opacity=".08" stroke-dasharray="5 9"/>
    <line x1="230" y1="10" x2="230" y2="410" stroke="#9eeeff" stroke-opacity=".08"/>
    <line x1="30" y1="210" x2="430" y2="210" stroke="#9eeeff" stroke-opacity=".08"/>
    <g font-family="monospace" font-size="13" letter-spacing="2">
      <g transform="translate(76 76)"><rect width="308" height="54" rx="7" fill="#121a20" stroke="#a9f1ff" stroke-opacity=".30"/><text x="18" y="33" fill="#d6e3e9">01  MODEL</text><circle cx="282" cy="27" r="4" fill="#a9f1ff"/></g>
      <g transform="translate(76 142)"><rect width="308" height="54" rx="7" fill="#10171c" stroke="#ffffff" stroke-opacity=".13"/><text x="18" y="33" fill="#c2ccd2">02  HARNESS</text><circle cx="282" cy="27" r="4" fill="#a9f1ff" fill-opacity=".8"/></g>
      <g transform="translate(76 208)"><rect width="308" height="54" rx="7" fill="#0f151a" stroke="#ffffff" stroke-opacity=".13"/><text x="18" y="33" fill="#c2ccd2">03  SOFTWARE</text><circle cx="282" cy="27" r="4" fill="#c9ffb2" fill-opacity=".75"/></g>
      <g transform="translate(76 274)"><rect width="308" height="54" rx="7" fill="#0d1317" stroke="#ffffff" stroke-opacity=".13"/><text x="18" y="33" fill="#c2ccd2">04  OS</text><circle cx="282" cy="27" r="4" fill="#a9f1ff" fill-opacity=".65"/></g>
      <g transform="translate(76 340)"><rect width="308" height="54" rx="7" fill="#0b1014" stroke="#ffffff" stroke-opacity=".13"/><text x="18" y="33" fill="#c2ccd2">05  HARDWARE</text><circle cx="282" cy="27" r="4" fill="#ffd8a8" fill-opacity=".8"/></g>
    </g>
    <text x="230" y="442" text-anchor="middle" fill="#7c8b96" font-family="monospace" font-size="12" letter-spacing="2">ONE OPTIMIZATION SURFACE</text>
  </g>
  <rect x="1" y="1" width="1598" height="558" fill="none" stroke="#dff8ff" stroke-opacity=".08"/>
</svg>

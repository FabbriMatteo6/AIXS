services:
  - type: web
    name: aixs-research
    runtime: static
    buildCommand: cd apps/website && npm ci && npm run build
    staticPublishPath: ./apps/website/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: redirect
        source: /it
        destination: /it/
      - type: redirect
        source: /privacy
        destination: /privacy/
      - type: redirect
        source: /it/privacy
        destination: /it/privacy/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: SITE_URL
        sync: false
      - key: JOIN_FORM_ENDPOINT
        sync: false
      - key: SPONSOR_FORM_ENDPOINT
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: PRIVACY_CONTROLLER
        sync: false
      - key: PLAUSIBLE_DOMAIN
        sync: false
